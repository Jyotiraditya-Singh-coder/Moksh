<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Report - Cognitive Brain Interface</title>
    <link rel="stylesheet" href="Dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Added for charts -->
    <style>
        #three-canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: var(--bg-color);
        }

        /* Styles for the progress report content */
        .main-content {
            margin-left: 320px; /* Space for knowledge sidebar */
            padding: 100px 40px 40px 40px;
            color: #fff;
            position: relative;
            z-index: 1;
            transition: margin-left 0.3s ease;
        }

        .main-sidebar.open ~ .main-content {
            margin-left: 320px;
        }

        @media (max-width: 900px) {
            .main-content {
                margin-left: 0;
            }
        }

        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .report-card {
            background: rgba(22, 22, 38, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
        }

        .report-card h2 {
            margin-top: 0;
            font-size: 1.5em;
            color: var(--primary-glow);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .task-list {
            list-style: none;
            padding: 0;
        }

        .task-list li {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .task-list li:last-child {
            border-bottom: none;
        }

        .task-list .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 15px;
            background-color: #4caf50; /* Green for completed */
        }

        .task-list .task-name {
            flex-grow: 1;
        }

        .task-list .task-date {
            font-size: 0.9em;
            color: #aaa;
        }

    </style>
</head>
<body>
    <!-- Page Transition Overlay -->
    <div class="page-transition-overlay" id="page-transition"></div>

    <!-- The 3D Brain visualization will render here -->
    <div id="three-canvas-container"></div>

    <!-- Top Navigation -->
    <header class="top-nav">
        <div class="nav-left">
            <button class="hamburger-btn" id="hamburger-btn">
                <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="brand">Cognitive OS</div>
        </div>
        <div class="nav-center">
            <!-- Search might not be relevant here, but keeping for consistency -->
        </div>
        <div class="nav-right">
            <button class="icon-btn"><svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></button>
            <div class="user-profile">
                <img src="https://ui-avatars.com/api/?name=User&background=a200ff&color=fff" alt="Profile">
            </div>
        </div>
    </header>

    <!-- Main Sidebar -->
    <nav class="main-sidebar" id="main-sidebar">
        <ul class="sidebar-links">
            <li><a href="Dashboard.html"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg> Brain Map</a></li>
            <li><a href="CompletedTasks.html"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg> Tasks</a></li>
            <li><a href="ProgressReport.html" class="active"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 3v18h18"></path><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"></path></svg> Analytics</a></li>
            <li><a href="#"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> Settings</a></li>
        </ul>
    </nav>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar listing all elements -->
    <div class="knowledge-sidebar">
        <h2>Knowledge Hub</h2>
        <ul id="knowledge-list">
            <!-- List items will be dynamically inserted here -->
        </ul>
    </div>

    <!-- Main Content for Progress Report -->
    <main class="main-content">
        <div class="report-grid">
            <div class="report-card">
                <h2>Performance Trend</h2>
                <canvas id="performanceChart"></canvas>
            </div>
            <div class="report-card">
                <h2>Recent Homework</h2>
                <ul class="task-list" id="task-list">
                    <!-- JS will populate this -->
                </ul>
            </div>
        </div>
    </main>

    <script>
        // --- PAGE TRANSITIONS ---
        document.addEventListener('DOMContentLoaded', () => {
            const transitionOverlay = document.getElementById('page-transition');
            setTimeout(() => {
                transitionOverlay.classList.add('fade-out');
            }, 100);
        });

        document.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (link && link.href && link.getAttribute('href').endsWith('.html')) {
                e.preventDefault();
                const targetUrl = link.getAttribute('href');
                const transitionOverlay = document.getElementById('page-transition');
                transitionOverlay.classList.remove('fade-out');
                
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 500);
            }
        });

        // --- UI LOGIC ---
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const mainSidebar = document.getElementById('main-sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        function toggleSidebar() {
            mainSidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('open');
        }
        hamburgerBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        // --- KNOWLEDGE HUB DATA ---
        const knowledgeData = {
            nodes: [
                { id: 'brain_map', name: 'Brain Map', mastery: 'strong', url: 'Dashboard.html' },
                { id: 'tasks', name: 'Tasks', mastery: 'weak', url: 'CompletedTasks.html' },
                { id: 'analytics', name: 'Analytics (Active)', mastery: 'unexplored', url: 'ProgressReport.html' },
                { id: 'settings', name: 'Settings', mastery: 'strong', url: '#' },
            ]
        };
        const COLORS = {
            strong: '#4caf50',
            weak: '#f44336',
            unexplored: '#9e9e9e'
        };

        // --- MOCK DATA for Progress Report ---
        const performanceData = {
            labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5', 'Week 6', 'Week 7'],
            scores: [65, 59, 80, 81, 75, 85, 92]
        };

        const recentTasks = [
            { name: 'Review Graph Theory concepts', date: '2 days ago' },
            { name: 'Complete BFS algorithm practice', date: '3 days ago' },
            { name: 'Study Big O notation', date: '3 days ago' },
            { name: 'Implement a Linked List', date: '5 days ago' },
            { name: 'Read chapter on Dynamic Programming', date: '6 days ago' }
        ];

        // --- REPORT RENDERING ---
        function renderReport() {
            // Render Knowledge Hub Sidebar
            const listContainer = document.getElementById('knowledge-list');
            listContainer.innerHTML = '';
            knowledgeData.nodes.forEach(nodeData => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${nodeData.name}</span>
                    <span class="dot-indicator" style="background-color: ${COLORS[nodeData.mastery]}"></span>
                `;
                li.addEventListener('click', () => {
                    if (nodeData.url && nodeData.url !== '#') {
                        window.location.href = nodeData.url;
                    }
                });
                listContainer.appendChild(li);
            });

            // Render Chart
            const ctx = document.getElementById('performanceChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: performanceData.labels,
                    datasets: [{
                        label: 'Mastery Score',
                        data: performanceData.scores,
                        backgroundColor: 'rgba(162, 0, 255, 0.2)',
                        borderColor: 'rgba(162, 0, 255, 1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#ccc' }
                        },
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#ccc' }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });

            // Render Task List
            const taskList = document.getElementById('task-list');
            taskList.innerHTML = '';
            recentTasks.forEach(task => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="status-dot"></span>
                    <span class="task-name">${task.name}</span>
                    <span class="task-date">${task.date}</span>
                `;
                taskList.appendChild(li);
            });
        }

        // --- 3D BACKGROUND SETUP (Simplified: No interaction) ---
        let scene, camera, renderer, controls;
        let brainGroup;
        let particlesMesh;
        const particleData = [];
        const clock = new THREE.Clock();
        let brainRotationY = 0;
        let brainBobTime = 0;

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a0a1a, 0.1);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 14;

            const container = document.getElementById('three-canvas-container');
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 3;
            controls.maxDistance = 20;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xa200ff, 1, 100);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.5);
            scene.add(hemiLight);
            const rimLight = new THREE.SpotLight(0x00d4ff, 2);
            rimLight.position.set(0, 10, -10);
            rimLight.angle = Math.PI / 4;
            rimLight.penumbra = 0.5;
            scene.add(rimLight);

            brainGroup = new THREE.Group();
            scene.add(brainGroup);

            createBrainShell();
            createParticles();

            window.addEventListener('resize', onWindowResize);
        }

        function deformToBrain(vec) {
            vec.z *= 1.25;
            if (vec.y > -1.0) {
                const fissure = Math.exp(-(vec.x * vec.x) / 0.8); 
                vec.y -= fissure * 1.5; 
                vec.x += (vec.x > 0 ? 1 : (vec.x < 0 ? -1 : 0)) * fissure * 0.4;
            }
            const temporalBulge = Math.exp(-((vec.y + 0.5)*(vec.y + 0.5) + (vec.z)*(vec.z)) / 3.0);
            vec.x += (vec.x > 0 ? 1 : -1) * temporalBulge * 0.5;
            if (vec.y < 0) vec.y *= 0.7;
            if (vec.z < 0) vec.x *= 1.1;
            if (vec.z > 0) vec.x *= 0.9;
            const f1 = 2.5, f2 = 5.1, f3 = 8.3;
            let noise = Math.sin(vec.x * f1 + vec.z) * Math.cos(vec.y * f1 + vec.x) * Math.sin(vec.z * f1 + vec.y);
            noise += 0.5 * Math.sin(vec.x * f2 - vec.y) * Math.cos(vec.y * f2 + vec.z);
            noise += 0.25 * Math.sin(vec.x * f3) * Math.cos(vec.z * f3);
            const foldDepth = 0.12;
            const folds = 1 - Math.abs(noise) * foldDepth;
            vec.multiplyScalar(folds);
        }

        function createBrainShell() {
            const geometry = new THREE.SphereGeometry(6, 200, 200);
            const pos = geometry.attributes.position;
            const vec = new THREE.Vector3();
            for(let i = 0; i < pos.count; i++) {
                vec.fromBufferAttribute(pos, i);
                deformToBrain(vec);
                pos.setXYZ(i, vec.x, vec.y, vec.z);
            }
            geometry.computeVertexNormals();
            const volumeMat = new THREE.MeshPhysicalMaterial({
                color: 0xd8b4fe,
                emissive: 0x220044,
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.85,
                depthWrite: false,
                roughness: 0.2,
                metalness: 0.2,
                transmission: 0.9,
                ior: 1.45,
                thickness: 2.0,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1,
            });
            const brainVolume = new THREE.Mesh(geometry, volumeMat);
            brainGroup.add(brainVolume);
        }

        function createParticles() {
            const particlesCount = 800;
            const positions = new Float32Array(particlesCount * 3);
            const geometry = new THREE.BufferGeometry();
            for (let i = 0; i < particlesCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const speed = 0.002 + Math.random() * 0.005;
                particleData.push({ theta, phi, speed });
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({
                color: 0xe0e6ff,
                size: 0.06,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });
            particlesMesh = new THREE.Points(geometry, material);
            brainGroup.add(particlesMesh);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            
            brainRotationY += 0.002;
            brainBobTime += 0.016;
            brainGroup.rotation.y = brainRotationY;
            brainGroup.position.y = Math.sin(brainBobTime * 1.5) * 0.2;

            if (particlesMesh) {
                const positions = particlesMesh.geometry.attributes.position.array;
                const vec = new THREE.Vector3();
                for (let i = 0; i < particleData.length; i++) {
                    const data = particleData[i];
                    data.theta += data.speed;
                    vec.setFromSphericalCoords(6.15, data.phi, data.theta);
                    deformToBrain(vec);
                    positions[i * 3] = vec.x;
                    positions[i * 3 + 1] = vec.y;
                    positions[i * 3 + 2] = vec.z;
                }
                particlesMesh.geometry.attributes.position.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // --- INITIALIZATION ---
        renderReport();
        init3D();
        animate3D();
    </script>
</body>
</html>
